<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie – Tischlerei Auer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --espresso: #1F1E1C;
      --bark:     #3B3835;
      --walnut:   #6E6762;
      --honey:    #9E8C7A;
      --gold:     #BFB0A2;
      --cream:    #F7F6F4;
      --parchment:#EFEEEB;
      --fog:      #DDDBD7;
      --white:    #FFFFFF;
      --rosegold: #C4896A;
      --radius-sm:4px; --radius-md:8px; --radius-lg:16px;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--espresso);overflow-x:hidden;}
    a{text-decoration:none;color:inherit;}

    /* NAV */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--white);box-shadow:0 2px 24px rgba(26,23,20,.08);border-bottom:1px solid var(--fog);}
    .nav-top{display:flex;justify-content:center;align-items:center;padding:.6rem 2rem;border-bottom:1px solid rgba(196,137,106,.18);}
    .nav-logo img{height:70px;width:auto;max-width:420px;object-fit:contain;}
    .nav-bottom{display:flex;align-items:center;justify-content:center;position:relative;padding:0 2rem;}
    .nav-links{display:flex;gap:0;list-style:none;}
    .nav-links a{display:block;font-size:.78rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--bark);padding:.8rem 1.4rem;position:relative;transition:color .2s;}
    .nav-links a::after{content:'';position:absolute;bottom:0;left:1.4rem;right:1.4rem;height:2px;background:var(--rosegold);transform:scaleX(0);transition:transform .2s var(--ease-out);}
    .nav-links a:hover,.nav-links a.active{color:var(--rosegold);}
    .nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
    .nav-cta{position:absolute;right:2rem;background:var(--honey);color:var(--white);padding:.45rem 1.1rem;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .2s;}
    .nav-cta:hover{background:var(--rosegold);}

    /* HERO */
    .galerie-hero{margin-top:130px;position:relative;height:320px;overflow:hidden;}
    .galerie-hero img{width:100%;height:100%;object-fit:cover;}
    .galerie-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(26,23,20,.3),rgba(26,23,20,.65));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
    .galerie-hero-overlay span{font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--rosegold);margin-bottom:.75rem;}
    .galerie-hero-overlay h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,5vw,4rem);color:white;font-weight:400;}

    /* FILTER TABS */
    .filter-bar{background:var(--white);border-bottom:1px solid var(--fog);position:sticky;top:130px;z-index:50;}
    .filter-inner{max-width:1280px;margin:0 auto;padding:0 2rem;display:flex;gap:0;overflow-x:auto;}
    .filter-btn{flex-shrink:0;padding:.9rem 1.4rem;font-size:.78rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--walnut);border:none;background:none;cursor:pointer;position:relative;transition:color .2s;}
    .filter-btn::after{content:'';position:absolute;bottom:0;left:1.4rem;right:1.4rem;height:2px;background:var(--rosegold);transform:scaleX(0);transition:transform .2s var(--ease-out);}
    .filter-btn:hover,.filter-btn.active{color:var(--rosegold);}
    .filter-btn:hover::after,.filter-btn.active::after{transform:scaleX(1);}

    /* GALERIE SECTIONS */
    .container{max-width:1280px;margin:0 auto;padding:0 2rem;}
    .galerie-section{padding:4rem 0;}
    .galerie-section+.galerie-section{border-top:1px solid var(--fog);}
    .section-header{display:flex;align-items:baseline;gap:1rem;margin-bottom:2rem;}
    .section-header h2{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;}
    .section-header span{font-size:.75rem;color:var(--walnut);}
    .label{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--rosegold);display:block;margin-bottom:.4rem;}

    /* FOTO GRID */
    .foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
    .foto-item{border-radius:var(--radius-md);overflow:hidden;cursor:pointer;position:relative;aspect-ratio:4/3;}
    .foto-item img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease-out);}
    .foto-item:hover img{transform:scale(1.05);}
    .foto-item-label{display:none;}

    /* LIGHTBOX */
    .lightbox{display:none;position:fixed;inset:0;z-index:300;background:rgba(26,23,20,.96);align-items:center;justify-content:center;}
    .lightbox.open{display:flex;}
    .lightbox img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:var(--radius-md);}
    .lightbox-close{position:absolute;top:1.5rem;right:1.5rem;background:rgba(255,255,255,.1);border:none;color:white;width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:white;width:48px;height:48px;border-radius:50%;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
    .lightbox-prev{left:1.5rem;} .lightbox-next{right:1.5rem;}
    .lightbox-prev:hover,.lightbox-next:hover{background:rgba(255,255,255,.2);}
    .lightbox-counter{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:.8rem;}

    /* FOOTER */
    .footer{background:var(--espresso);padding:2.5rem 2rem;text-align:center;}
    .footer p{font-size:.8rem;color:rgba(214,206,194,.5);}
    .footer a{color:rgba(214,206,194,.5);margin:0 .75rem;transition:color .2s;}
    .footer a:hover{color:var(--fog);}

    @media(max-width:768px){
      .nav-links{display:none;}
      .nav-cta{display:none;}
      .nav-bottom{display:none;}
      .galerie-hero{height:200px;margin-top:90px;}
      .filter-bar{top:90px;}
      .foto-grid{grid-template-columns:repeat(2,1fr);gap:.75rem;}
      .filter-inner{padding:0 1rem;}
      .filter-btn{padding:.7rem .9rem;font-size:.7rem;}
    }
  </style>
</head>

  let curGallery = '', curIndex = 0;

  function openLightbox(gallery, index) {
    curGallery = gallery; curIndex = index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function changeLightbox(dir) {
    const imgs = galleries[curGallery];
    curIndex = (curIndex + dir + imgs.length) % imgs.length;
    updateLightbox();
  }
  function updateLightbox() {
    const imgs = galleries[curGallery];
    document.getElementById('lightbox-img').src = imgs[curIndex];
    document.getElementById('lightbox-counter').textContent = `${curIndex+1} / ${imgs.length}`;
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') changeLightbox(1);
    if (e.key === 'ArrowLeft') changeLightbox(-1);
    if (e.key === 'Escape') closeLightbox();
  });

  function filterSection(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.galerie-section').forEach(s => {
      s.style.display = (cat === 'alle' || s.dataset.category === cat) ? '' : 'none';
    });
    if (cat !== 'alle') document.getElementById('sec-'+cat).scrollIntoView({behavior:'smooth', block:'start'});
  }
</script>
