    :root {

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}

    a{text-decoration:none;color:inherit;}

    /* NAV */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--white);box-shadow:0 2px 24px rgba(26,23,20,.08);border-bottom:1px solid var(--fog);}

    .nav-bottom{display:flex;align-items:center;justify-content:center;position:relative;padding:0 2rem;}

    .nav-links a{display:block;font-size:.78rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--bark);padding:.8rem 1.4rem;position:relative;transition:color .2s;}

    .nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
    .nav-cta{position:absolute;right:2rem;background:var(--honey);color:var(--white);padding:.45rem 1.1rem;border-radius:var(--radius-sm);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .2s;}

    /* HERO */
    .galerie-hero{margin-top:130px;position:relative;height:320px;overflow:hidden;}

    /* FILTER TABS */
    .filter-bar{background:var(--white);border-bottom:1px solid var(--fog);position:sticky;top:130px;z-index:50;}
    .filter-inner{max-width:1280px;margin:0 auto;padding:0 2rem;display:flex;gap:0;overflow-x:auto;}

    .label{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--rosegold);display:block;margin-bottom:.4rem;}

    .foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
    .foto-item{border-radius:var(--radius-md);overflow:hidden;cursor:pointer;position:relative;aspect-ratio:4/3;}

    .foto-item:hover img{transform:scale(1.05);}
    .foto-item-label{display:none;}

    /* LIGHTBOX */
    .lightbox{display:none;position:fixed;inset:0;z-index:300;background:rgba(26,23,20,.96);align-items:center;justify-content:center;}

    .lightbox-close{position:absolute;top:1.5rem;right:1.5rem;background:rgba(255,255,255,.1);border:none;color:white;width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .lightbox-prev,.lightbox-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:white;width:48px;height:48px;border-radius:50%;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
    .lightbox-prev{left:1.5rem;} .lightbox-next{right:1.5rem;}
    .lightbox-prev:hover,.lightbox-next:hover{background:rgba(255,255,255,.2);}
    .lightbox-counter{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:.8rem;}

    /* FOOTER */
    .footer{background:var(--espresso);padding:2.5rem 2rem;text-align:center;}
    .footer p{font-size:.8rem;color:rgba(214,206,194,.5);}
    .footer a{color:rgba(214,206,194,.5);margin:0 .75rem;transition:color .2s;}
    .footer a:hover{color:var(--fog);}

    @media(max-width:768px){

      .filter-inner{padding:0 1rem;}

    }

afd","alt":"Holztür mit Diagonalstreben"},{"src":"Unsere%20T%C3%BCren/Holzt%C3%BCr%20mit%20dunkler%20Maserung.png?v=2e8165664e2e","alt":"Holztür mit dunkler Maserung"},{"src":"Unsere%20T%C3%BCren/Holzt%C3%BCr%20mit%20Glas%20Frontalansicht.png?v=af6469302b20","alt":"Holztür mit Glas Frontalansicht"},{"src":"Unsere%20T%C3%BCren/Holzt%C3%BCr%20mit%20wei%C3%9Fer%20Wand%20Website.png?v=4bc7811eb6d9","alt":"Holztür mit weißer Wand Website"},{"src":"Unsere%20T%C3%BCren/Holzt%C3%BCr%20ohne%20unteren%20Absatz.png?v=3cdd2f918963","alt":"Holztür ohne unteren Absatz"},{"src":"Unsere%20T%C3%BCren/Ornamentt%C3%BCr%20in%20Wandnische%20bearbeitet.png?v=e16dab4d6833","alt":"Ornamenttür in Wandnische bearbeitet"},{"src":"Unsere%20T%C3%BCren/Ornamentt%C3%BCr%20mit%20Rauten%20und%20Kreuzen.png?v=ea2c326b0ad7","alt":"Ornamenttür mit Rauten und Kreuzen"},{"src":"Unsere%20T%C3%BCren/Rustikale%20Doppelt%C3%BCr%20mit%20Ornamenten.png?v=29401e6340ad","alt":"Rustikale Doppeltür mit Ornamenten"},{"src":"Unsere%20T%C3%BCren/Rustikale%20Eingangst%C3%BCr%20bearbeitet.png?v=68ed5b928cec","alt":"Rustikale Eingangstür bearbeitet"},{"src":"Unsere%20T%C3%BCren/Rustikale%20Rundbogent%C3%BCr%20aufgehellt.png?v=eab35e42aba7","alt":"Rustikale Rundbogentür aufgehellt"},{"src":"Unsere%20T%C3%BCren/Spanien.png?v=7cbc23acd43e","alt":"Spanien"},{"src":"Unsere%20T%C3%BCren/Wei%C3%9Fe%20Glast%C3%BCr%20mit%20Bergblick.png?v=cb79e020d624","alt":"Weiße Glastür mit Bergblick"},{"src":"Unsere%20T%C3%BCren/Wei%C3%9Fe%20Holzt%C3%BCr%20neben%20Treppe.png?v=a1b9de5b6ec6","alt":"Weiße Holztür neben Treppe"},{"src":"Unsere%20T%C3%BCren/Wei%C3%9Fe%20Innent%C3%BCr%20Freigestellt%20bearbeitet.png?v=4f408a08735f","alt":"Weiße Innentür Freigestellt bearbeitet"},{"src":"Unsere%20T%C3%BCren/Wei%C3%9Fe%20T%C3%BCr%20hochgeladene%20Version.png?v=5ea6b8f2a496","alt":"Weiße Tür hochgeladene Version"},{"src":"Unsere%20T%C3%BCren/Zwei%20dunkle%20T%C3%BCren%20mit%20Schnitzereien.png?v=82517e420b73","alt":"Zwei dunkle Türen mit Schnitzereien"}];const box=document.querySelector('dialog'),photo=box.querySelector('img'),counter=box.querySelector('output');let current=0,opener;function show(i){current=(i+photos.length)%photos.length;photo.src=photos[current].src;photo.alt=photos[current].alt;counter.textContent=(current+1)+' / '+photos.length;}document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>{opener=b;show(Number(b.dataset.index));box.showModal();document.body.style.overflow='hidden';}));box.querySelector('.close').onclick=()=>box.close();box.querySelector('.prev').onclick=()=>show(current-1);box.querySelector('.next').onclick=()=>show(current+1);box.addEventListener('close',()=>{document.body.style.overflow='';opener?.focus();});box.addEventListener('click',e=>{if(e.target===box)box.close();});box.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1);}});</script></body></html>
